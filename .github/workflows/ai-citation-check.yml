name: AI citation check

# Nightly cron tracking how often AI assistants (Claude, GPT, Perplexity)
# cite Glitch Grow when asked buying-intent questions about AI agents,
# automation alternatives, voice AI, etc. Results are committed back to
# scripts/citation-results/<YYYY-MM-DD>.csv so the trend is queryable.
#
# Skips automatically if no provider API keys are configured as repo
# secrets — set ANTHROPIC_API_KEY / OPENAI_API_KEY / PERPLEXITY_API_KEY
# (any subset) under the repo's "Actions secrets" to enable.

on:
  schedule:
    # 06:00 UTC nightly. Adjust if you want a different cadence.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      quick:
        description: 'Run only first 5 prompts (smoke test)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Skip if no provider keys
        id: gate
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}${{ secrets.OPENAI_API_KEY }}${{ secrets.PERPLEXITY_API_KEY }}${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "No provider API keys configured — skipping. Set at least one of ANTHROPIC_API_KEY / OPENAI_API_KEY / PERPLEXITY_API_KEY / OPENROUTER_API_KEY in repo secrets to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run citation check
        if: steps.gate.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then
            node --experimental-strip-types scripts/ai-citation-check.ts --quick
          else
            node --experimental-strip-types scripts/ai-citation-check.ts
          fi

      - name: Commit results
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scripts/citation-results/
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): nightly AI citation results"
            git push
          else
            echo "No new results to commit."
          fi
